# Geometry ablation at one fixed K; supply a representative captured tensor file.
# Match K to the training comparison when using this diagnostic alongside its results.
[source]
kind = "capture"
path = ".local/capture.pt"

[loss]
direction = "reverse"
temperature = 0.7
chunk_size = 256
pairs = 4

[experiment]
device = "cuda:0"
dtype = "bfloat16"
seed = 42
train_head = true
methods = ["quantile"]
vocabulary_orders = ["principal", "natural"]
pair_budgets = [4]
warmup = 5
repeats = 100
